<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>SIP-BK Integrated System</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #fff;
      z-index: 10;
      transition: opacity 0.4s ease;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #loader p {
      font-size: 14px;
      color: #94a3b8;
      margin: 0;
    }

    #appFrame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 5;
    }

    #fallback {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 15;
      background: #0f172a;
      color: #fff;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    #fallback a {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 24px;
      background: #3b82f6;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
    <p>Memuat Aplikasi SIP-BK...</p>
  </div>

  <div id="fallback">
    <h2>Aplikasi tidak dapat ditampilkan di sini</h2>
    <p>Klik tombol di bawah untuk membuka langsung.</p>
    <a id="openDirect" href="#" target="_top" rel="noopener">Buka Aplikasi</a>
  </div>

  <iframe id="appFrame"
    style="display:none;"
    title="SIP-BK Integrated System"
    allow="clipboard-write"
    onload="document.getElementById('loader').style.opacity='0'; setTimeout(()=>document.getElementById('loader').style.display='none', 400);">
  </iframe>

  <script>
    // GANTI URL DI BAWAH INI DENGAN URL DEPLOY APPS SCRIPT KAMU
    const APP_URL = "https://script.google.com/macros/s/AKfycbzzW_hbDMwv6hMHpjNWfBQ8OPsz9M4IcWL92CbsNaTwbGEW6tS00cQQW3hGiBifkS99hg/exec";

    document.getElementById('openDirect').href = APP_URL;

    // Deteksi perangkat mobile (Android/iOS) secara umum.
    // CATATAN: sebelumnya kode ini hanya redirect kalau UA mengandung "Chrome",
    // tapi itu keliru — hampir SEMUA browser Chromium di Android (Samsung Internet,
    // UC Browser, Opera, WebView aplikasi, dst) juga menaruh token "Chrome/x.x"
    // di user-agent-nya, dan browser mobile lain (Safari iOS dengan ITP-nya)
    // punya proteksi cookie pihak-ketiga yang setara ketatnya. Jadi pada
    // praktiknya HAMPIR SEMUA browser mobile akan gagal menampilkan sesi
    // login Google di dalam iframe cross-origin. Solusi paling stabil:
    // anggap SEMUA mobile butuh redirect langsung (bukan cuma yang match regex
    // Chrome), dan baru pakai iframe untuk desktop.
    const ua = navigator.userAgent;
    const isMobile = /Android|iPhone|iPad|iPod/i.test(ua) ||
                      (navigator.maxTouchPoints > 1 && /Macintosh/i.test(ua)); // iPadOS kadang menyamar sbg Mac

    if (isMobile) {
      // Redirect top-level langsung — address bar akan menuju APP_URL.
      // Ini memang konsekuensi yang tidak terhindarkan selama Apps Script
      // membutuhkan sesi login Google di dalam sebuah iframe cross-origin.
      window.location.replace(APP_URL);
    } else {
      // Desktop: coba tampilkan lewat iframe.
      const frame = document.getElementById('appFrame');
      frame.style.display = 'block';
      frame.src = APP_URL;

      // Jika iframe gagal dimuat (mis. server memblokir framing, X-Frame-Options,
      // atau load lambat/timeout), tampilkan tombol fallback ke user setelah 8 detik.
      // Catatan: event 'onload' iframe TETAP bisa terpicu walau kontennya diblokir
      // X-Frame-Options, karena itu browser tetap menerima respons HTTP-nya.
      // Timeout ini hanya menjaga-jaga bila loading benar2 tak kunjung selesai.
      setTimeout(() => {
        const loader = document.getElementById('loader');
        if (loader.style.display !== 'none') {
          document.getElementById('fallback').style.display = 'flex';
          loader.style.display = 'none';
        }
      }, 8000);
    }
  </script>

</body>
</html>
